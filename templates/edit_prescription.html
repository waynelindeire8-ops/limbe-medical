<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Prescription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" >
        {% include 'sidebar.html' %}
        <main class="main-content" >
            <a href="{{ url_for('prescriptions') }}" class="back-link" style="color: #4361ee; text-decoration: none; display: block; margin-bottom: 20px;"><i class="fas fa-arrow-left"></i> Back to Prescriptions</a>
            <div class="card" style="background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05);">
                <h2 style="margin-top: 0;">Edit Prescription</h2>
                <form method="post" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div>
                        <label>Patient</label>
                        <select name="patient_id" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                            {% for p in patients %}
                            <option value="{{ p.patient_id }}" {% if p.patient_id == rx.patient_id %}selected{% endif %}>{{ p.first_name }} {{ p.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label>Doctor</label>
                        <select name="doctor_id" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                            {% for d in doctors %}
                            <option value="{{ d.doctor_id }}" {% if d.doctor_id == rx.doctor_id %}selected{% endif %}>Dr. {{ d.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div>
                        <label>Date</label>
                        <input type="date" name="date" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" value="{{ rx.date }}">
                    </div>
                    <div>
                        <label>Status</label>
                        <select name="status" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                            <option {% if rx.status == 'Active' %}selected{% endif %}>Active</option>
                            <option {% if rx.status == 'Completed' %}selected{% endif %}>Completed</option>
                            <option {% if rx.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                        </select>
                    </div>
                    <div style="grid-column: 1 / span 2;">
                        <label>Medications</label>
                        <div id="medication-list">
                            {% set meds = rx.medication.split(', ') %}
                            {% for med in meds %}
                            <div class="medication-item" style="display: flex; gap: 10px; margin-bottom: 10px;">
                                <input type="text" name="medication[]" required placeholder="Medication name" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" value="{{ med }}">
                                <button type="button" onclick="removeMedication(this)" class="btn btn-danger" style="background: #ff4d4d; color: white; border: none; border-radius: 8px; padding: 0 15px; {% if meds|length <= 1 %}display: none;{% endif %}">×</button>
                            </div>
                            {% endfor %}
                        </div>
                        <button type="button" onclick="addMedication()" class="btn btn-outline" style="margin-top: 5px; background: #f0f2f5; border: 1px solid #ddd; border-radius: 8px; padding: 5px 15px; cursor: pointer;"><i class="fas fa-plus"></i> Add Another Medication</button>
                    </div>
                    <div style="grid-column: 1 / span 2;">
                        <label>Duration</label>
                        <input type="text" name="duration" required placeholder="e.g., 7 days" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;" value="{{ rx.duration }}">
                    </div>
                    <div style="grid-column: 1 / span 2;">
                        <label>Notes</label>
                        <textarea name="notes" rows="3" placeholder="Additional instructions" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">{{ rx.notes }}</textarea>
                    </div>
                    <div style="grid-column: 1 / span 2; text-align: right;">
                        <button type="submit" class="btn btn-primary" style="padding: 10px 20px; background-color: #4361ee; color: white; border: none; border-radius: 8px;">Save Changes</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script>
        function addMedication() {
            const list = document.getElementById('medication-list');
            const newItem = document.createElement('div');
            newItem.className = 'medication-item';
            newItem.style.display = 'flex';
            newItem.style.gap = '10px';
            newItem.style.marginBottom = '10px';
            newItem.innerHTML = `
                <input type="text" name="medication[]" required placeholder="Medication name" style="flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 8px;">
                <button type="button" onclick="removeMedication(this)" class="btn btn-danger" style="background: #ff4d4d; color: white; border: none; border-radius: 8px; padding: 0 15px;">×</button>
            `;
            list.appendChild(newItem);
            updateRemoveButtons();
        }

        function removeMedication(btn) {
            btn.closest('.medication-item').remove();
            updateRemoveButtons();
        }

        function updateRemoveButtons() {
            const items = document.querySelectorAll('.medication-item');
            items.forEach(item => {
                const btn = item.querySelector('.btn-danger');
                if (items.length > 1) {
                    btn.style.display = 'block';
                } else {
                    btn.style.display = 'none';
                }
            });
        }

        document.addEventListener('DOMContentLoaded', function() {
            updateRemoveButtons();
        });
    </script>
</body>
</html>
