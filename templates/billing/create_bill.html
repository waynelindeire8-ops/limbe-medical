<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Bill - Limbe Medical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-control {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn-add {
            background-color: #4361ee;
            color: white;
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
        }
        .item-list {
            margin-top: 20px;
        }
        .item-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            align-items: center;
        }
        .invoice-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .item-row {
            display: flex;
            flex-grow: 1;
            margin-right: 10px;
        }
        .item-row input[type="text"] {
            flex-grow: 1;
            margin-right: 10px;
        }
        .item-row input[type="number"] {
            width: 120px;
        }
        .remove-btn {
            background-color: #f72585;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include 'sidebar.html' %}
        
        <main class="main-content">
            <header class="header">
                <h1>Create New Bill</h1>
                <div class="header-right">
                    <a href="{{ url_for('billing_dashboard') }}" class="btn btn-outline"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
                </div>
            </header>

            <div class="card">
                <form action="{{ url_for('create_bill') }}" method="post">
                    <div class="form-group">
                        <label for="patient_id">Patient</label>
                        <select name="patient_id" id="patient_id" class="form-control" required>
                            <option value="">Select Patient</option>
                            {% for patient in patients %}
                            <option value="{{ patient.patient_id }}">{{ patient.first_name }} {{ patient.last_name }} ({{ patient.patient_id }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="inventory_search">Add Item from Inventory</label>
                        <input type="text" id="inventory_search" class="form-control" placeholder="Search for an item...">
                        <div id="inventory_results"></div>
                    </div>

                    <div class="item-list" id="itemList">
                        <!-- Items will be added here dynamically -->
                    </div>
                    
                    <button type="button" class="btn-add" onclick="addItem()"><i class="fas fa-plus"></i> Add Custom Item</button>

                    <div class="form-group" style="margin-top: 20px;">
                        <label for="total_amount">Total Amount</label>
                        <input type="text" id="total_amount" name="total_amount" class="form-control" readonly>
                    </div>

                    <div class="form-actions" style="margin-top: 30px; display: flex; justify-content: flex-end; gap: 10px;">
                        <a href="{{ url_for('billing_dashboard') }}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Bill</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        let inventory = {{ inventory | tojson }};

        document.getElementById('inventory_search').addEventListener('keyup', function() {
            let searchTerm = this.value.toLowerCase();
            let resultsContainer = document.getElementById('inventory_results');
            resultsContainer.innerHTML = '';
            if (searchTerm.length < 2) return;

            let filteredItems = inventory.filter(item => item.name.toLowerCase().includes(searchTerm));
            filteredItems.forEach(item => {
                let div = document.createElement('div');
                div.innerHTML = `${item.name} - ${item.unit_price}`;
                div.onclick = () => {
                    addItem(item.name, item.unit_price);
                    document.getElementById('inventory_search').value = '';
                    resultsContainer.innerHTML = '';
                };
                resultsContainer.appendChild(div);
            });
        });

        function addItem(name = '', cost = '') {
            const itemList = document.getElementById('itemList');
            const itemRow = document.createElement('div');
            itemRow.className = 'invoice-item';
            itemRow.innerHTML = `
                <div class="item-row">
                    <input type="text" name="items[]" class="form-control" placeholder="Service / Item Description" value="${name}" required>
                    <input type="number" name="costs[]" class="form-control cost-input" placeholder="Cost (MWK)" step="0.01" min="0" value="${cost}" oninput="updateTotal()" required>
                </div>
                <button type="button" class="remove-btn" onclick="removeItem(this)"><i class="fas fa-trash"></i></button>
            `;
            itemList.appendChild(itemRow);
            updateTotal();
        }

        function removeItem(button) {
            button.parentElement.remove();
            updateTotal();
        }

        function updateTotal() {
            let total = 0;
            document.querySelectorAll('.cost-input').forEach(input => {
                total += parseFloat(input.value) || 0;
            });
            document.getElementById('total_amount').value = total.toFixed(2);
        }

        // Add a default item if the list is empty on page load
        document.addEventListener('DOMContentLoaded', function() {
            if (document.querySelectorAll('.invoice-item').length === 0) {
                addItem();
            }
            updateTotal();
        });
    </script>
</body>
</html>
