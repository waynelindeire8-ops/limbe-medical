<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Limbe Medical Clinic</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .chart-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .summary-card {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
        }
        .summary-card h2 {
            font-size: 36px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include 'sidebar.html' %}
        
        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Analytics Dashboard</h2>
                <div style="color: #666;">Data Overview</div>
            </div>

            <div class="stats-grid">
                <div class="summary-card">
                    <h3>Total Patients</h3>
                    <h2>{{ total_patients }}</h2>
                </div>
                <div class="summary-card" style="background: linear-gradient(135deg, #f72585, #b5179e);">
                    <h3>Appointments</h3>
                    <h2>{{ total_appointments }}</h2>
                </div>
                <div class="summary-card" style="background: linear-gradient(135deg, #4cc9f0, #4895ef);">
                    <h3>Revenue</h3>
                    <h2>${{ total_revenue }}</h2>
                </div>
            </div>

            <div class="analytics-grid">
                <div class="chart-card">
                    <h3>Appointment Status</h3>
                    <canvas id="statusChart"></canvas>
                </div>
                <div class="chart-card">
                    <h3>Revenue Trend (Last 6 Months)</h3>
                    <canvas id="revenueChart"></canvas>
                </div>
            </div>

            <div class="analytics-grid">
                <div class="chart-card" style="grid-column: 1 / -1;">
                    <h3>Top Doctors by Appointments</h3>
                    <canvas id="doctorChart"></canvas>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Appointment Status Chart
        const statusCtx = document.getElementById('statusChart').getContext('2d');
        new Chart(statusCtx, {
            type: 'doughnut',
            data: {
                labels: {{ status_labels | tojson }},
                datasets: [{
                    data: {{ status_data | tojson }},
                    backgroundColor: ['#4cc9f0', '#28a745', '#dc3545']
                }]
            }
        });

        // Revenue Chart
        const revenueCtx = document.getElementById('revenueChart').getContext('2d');
        new Chart(revenueCtx, {
            type: 'line',
            data: {
                labels: {{ revenue_labels | tojson }},
                datasets: [{
                    label: 'Revenue ($)',
                    data: {{ revenue_data | tojson }},
                    borderColor: '#4361ee',
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(67, 97, 238, 0.1)'
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });

        // Doctor Chart
        const doctorCtx = document.getElementById('doctorChart').getContext('2d');
        new Chart(doctorCtx, {
            type: 'bar',
            data: {
                labels: {{ top_doctors_labels | tojson }},
                datasets: [{
                    label: 'Appointments',
                    data: {{ top_doctors_data | tojson }},
                    backgroundColor: '#f72585'
                }]
            },
            options: {
                scales: {
                    y: { beginAtZero: true }
                }
            }
        });
    </script>
</body>
</html>
