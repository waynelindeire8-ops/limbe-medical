<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Doctor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <style>
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 20px auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #4361ee;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #3f37c9;
        }
        .back-link {
            display: block;
            margin-bottom: 20px;
            color: #4361ee;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container" >
        {% include 'sidebar.html' %}
        
        <main class="main-content" >
            <a href="{{ url_for('doctors') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Doctors</a>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'error' else 'danger' }}" style="padding: 15px; margin-bottom: 20px; border-radius: 8px; background-color: {{ '#d4edda' if category == 'success' else '#f8d7da' }}; color: {{ '#155724' if category == 'success' else '#721c24' }}; border: 1px solid {{ '#c3e6cb' if category == 'success' else '#f5c6cb' }};">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <div class="form-container">
                <h2>Edit Doctor</h2>
                <br>
                <form method="POST">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" value="{{ doctor.first_name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" value="{{ doctor.last_name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="specialty">Specialty</label>
                        <input type="text" id="specialty" name="specialty" value="{{ doctor.specialty }}" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" value="{{ doctor.phone }}" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" value="{{ doctor.email }}">
                    </div>
                    <div class="form-group">
                        <label for="status">Status</label>
                        <select id="status" name="status" required>
                            <option value="Available" {% if doctor.status == 'Available' %}selected{% endif %}>Available</option>
                            <option value="Busy" {% if doctor.status == 'Busy' %}selected{% endif %}>Busy</option>
                            <option value="Off" {% if doctor.status == 'Off' %}selected{% endif %}>Off Duty</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; align-items: center; gap: 10px;">
                        <input type="checkbox" id="is_locum" name="is_locum" style="width: auto;" onchange="toggleLocumName()" {% if doctor.is_locum %}checked{% endif %}>
                        <label for="is_locum" style="margin-bottom: 0;">Is Locum Doctor?</label>
                    </div>
                    <div class="form-group" id="locum_name_group" style="display: {% if doctor.is_locum %}block{% else %}none{% endif %};">
                        <label for="locum_name">Locum Name</label>
                        <input type="text" id="locum_name" name="locum_name" value="{{ doctor.locum_name }}" placeholder="Enter locum doctor's name">
                    </div>
                    <button type="submit" class="btn-submit">Update Doctor</button>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        function toggleLocumName() {
            const isLocum = document.getElementById('is_locum').checked;
            document.getElementById('locum_name_group').style.display = isLocum ? 'block' : 'none';
        }
        document.addEventListener('DOMContentLoaded', function() {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                new Choices(select, {
                    searchEnabled: true,
                    itemSelectText: '',
                    placeholder: true,
                });
            });
        });
    </script>
</body>
</html>
