<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Check-In</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container" style="display:flex; height:100vh; overflow:hidden;">
        {% include 'sidebar.html' %}
        <main class="main-content" style="flex:1; padding:20px; overflow-y:auto;">
            <h2>Patient Check-In</h2>
            <div class="card" style="max-width:700px;">
                <form method="post" style="display:grid; grid-template-columns: 1fr 1fr; gap:12px;">
                    <div class="form-group" style="grid-column:1 / span 2;">
                        <label>Patient</label>
                        <select name="patient_id" required>
                            <option value="">-- Select Patient --</option>
                            {% for p in patients %}
                            <option value="{{ p.patient_id }}">{{ p.first_name }} {{ p.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <select name="department">
                            {% for d in departments %}
                            <option value="{{ d }}">{{ d }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Doctor</label>
                        <select name="doctor_id">
                            <option value="">Unassigned</option>
                            {% for d in doctors %}
                            <option value="{{ d.doctor_id }}">Dr. {{ d.last_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group" style="grid-column:1 / span 2;">
                        <label>Visit Reason</label>
                        <input type="text" name="reason" placeholder="e.g., Chest pain, lab test">
                    </div>
                    <div class="form-group">
                        <label>Urgency</label>
                        <select name="urgency">
                            {% for u in urgencies %}
                            <option value="{{ u }}">{{ u }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Special Category</label>
                        <select name="special">
                            {% for s in specials %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div style="grid-column:1 / span 2; display:flex; gap:10px; justify-content:flex-end;">
                        <a href="{{ url_for('queue_dashboard') }}" class="btn btn-outline">Cancel</a>
                        <button type="submit" class="btn btn-primary">Check In</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <style>
        .card { background:#fff; padding:20px; border-radius:12px; box-shadow:0 4px 10px rgba(0,0,0,0.05); }
        .form-group label { display:block; margin-bottom:6px; font-weight:500; }
        .form-group select, .form-group input { width:100%; padding:10px; border:1px solid #ddd; border-radius:6px; }
        .btn { padding:10px 16px; border-radius:6px; }
        .btn-outline { border:1px solid #4361ee; color:#4361ee; }
        .btn-primary { background:#4361ee; color:#fff; border:none; }
    </style>
</body>
</html>
