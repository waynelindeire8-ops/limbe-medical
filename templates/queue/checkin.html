<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Check-in - Limbe Medical</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <style>
        .checkin-form {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 30px;
            max-width: 800px;
            margin: 20px auto;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .vitals-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        {% include 'sidebar.html' %}
        
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <h1>Patient Check-in</h1>
                    <p>Assign a patient to a department and triage level.</p>
                </div>
            </header>

            <div class="checkin-form">
                <form action="{{ url_for('queue_checkin') }}" method="POST">
                    <div class="form-grid">
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Select Patient</label>
                            <select name="patient_id" required>
                                <option value="">-- Choose Patient --</option>
                                {% for p in patients %}
                                <option value="{{ p.patient_id }}">{{ p.last_name }}, {{ p.first_name }} ({{ p.patient_id }}) {% if p.scheme_provider %}- {{ p.scheme_provider }}{% endif %}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Department</label>
                            <select name="department" required>
                                {% for d in departments %}
                                <option value="{{ d }}">{{ d }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Assigned Doctor</label>
                            <select name="doctor_id">
                                <option value="Unassigned">Unassigned</option>
                                {% for doc in doctors %}
                                <option value="{{ doc.doctor_id }}">Dr. {{ doc.last_name }} ({{ doc.specialty }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Urgency / Priority</label>
                            <select name="urgency" required>
                                {% for u in urgencies %}
                                <option value="{{ u }}" {% if u == 'Routine' %}selected{% endif %}>{{ u }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Triage Level</label>
                            <select name="triage_level" required>
                                <option value="1">1 - Critical (Immediate)</option>
                                <option value="2">2 - Urgent (10-15 mins)</option>
                                <option value="3" selected>3 - Routine (30-60 mins)</option>
                                <option value="4">4 - Non-urgent</option>
                                <option value="5">5 - Very non-urgent</option>
                            </select>
                        </div>
                        
                        <div class="form-group" style="grid-column: span 2;">
                            <label>Visit Reason</label>
                            <textarea name="reason" rows="3" placeholder="Chief complaint or reason for visit"></textarea>
                        </div>

                        <div class="form-group" style="grid-column: span 2;">
                            <label>Vitals (Optional)</label>
                            <div class="vitals-grid">
                                <div>
                                    <label style="font-size: 12px;">BP (mmHg)</label>
                                    <input type="text" name="bp" placeholder="e.g. 120/80">
                                </div>
                                <div>
                                    <label style="font-size: 12px;">Temp (°C)</label>
                                    <input type="number" step="0.1" name="temp" placeholder="e.g. 36.5">
                                </div>
                                <div>
                                    <label style="font-size: 12px;">Weight (kg)</label>
                                    <input type="number" step="0.1" name="weight" placeholder="e.g. 70">
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="margin-top: 30px; text-align: right;">
                        <button type="submit" class="btn btn-primary" style="padding: 12px 30px;">Complete Check-in</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                new Choices(select, {
                    searchEnabled: true,
                    itemSelectText: '',
                    placeholder: true,
                    placeholderValue: '-- Select --',
                });
            });
        });
    </script>
</body>
</html>
