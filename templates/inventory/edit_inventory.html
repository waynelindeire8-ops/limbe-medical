<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Inventory Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 800px; margin: 20px auto; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; }
        .btn-submit { background: #4361ee; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 20px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #4361ee; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container" style="display: flex; height: 100vh; overflow: hidden;">
        {% include 'sidebar.html' %}
        <main class="main-content" style="flex: 1; padding: 20px; overflow-y: auto;">
            <a href="{{ url_for('inventory') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Inventory</a>
            
            <div class="form-container">
                <h2>Edit Item: {{ item.name }}</h2>
                <p style="color: #666; margin-bottom: 20px;">Update details for item code: <strong>{{ item.item_id }}</strong></p>
                
                <form method="POST">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>Item Code / ID</label>
                            <input type="text" value="{{ item.item_id }}" disabled style="background: #f8f9fa; cursor: not-allowed;">
                        </div>
                        <div class="form-group">
                            <label for="name">Item Name</label>
                            <input type="text" id="name" name="name" value="{{ item.name }}" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <select id="category" name="category" required>
                                <option value="Medication" {% if item.category == 'Medication' %}selected{% endif %}>Medication</option>
                                <option value="Surgical" {% if item.category == 'Surgical' %}selected{% endif %}>Surgical</option>
                                <option value="Lab" {% if item.category == 'Lab' %}selected{% endif %}>Lab Supplies</option>
                                <option value="General" {% if item.category == 'General' %}selected{% endif %}>General Medical</option>
                                <option value="Other" {% if item.category == 'Other' %}selected{% endif %}>Other</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="unit_price">Unit Price (MWK)</label>
                            <input type="number" step="0.01" id="unit_price" name="unit_price" value="{{ item.unit_price }}" required>
                        </div>
                        <div class="form-group">
                            <label for="quantity">Current Stock Quantity</label>
                            <input type="number" id="quantity" name="quantity" value="{{ item.quantity }}" required>
                        </div>
                        <div class="form-group">
                            <label for="min_quantity">Low Stock Alert Level</label>
                            <input type="number" id="min_quantity" name="min_quantity" value="{{ item.min_quantity }}">
                        </div>
                        <div class="form-group">
                            <label for="dosage_form">Dosage Form</label>
                            <input type="text" id="dosage_form" name="dosage_form" value="{{ item.dosage_form }}">
                        </div>
                        <div class="form-group">
                            <label for="strength">Strength</label>
                            <input type="text" id="strength" name="strength" value="{{ item.strength }}">
                        </div>
                        <div class="form-group">
                            <label for="expiry_date">Expiry Date</label>
                            <input type="date" id="expiry_date" name="expiry_date" value="{{ item.expiry_date }}">
                        </div>
                        <div class="form-group">
                            <label for="batch_number">Batch Number</label>
                            <input type="text" id="batch_number" name="batch_number" value="{{ item.batch_number }}">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="supplier">Supplier</label>
                        <input type="text" id="supplier" name="supplier" value="{{ item.supplier }}">
                    </div>
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="3">{{ item.notes }}</textarea>
                    </div>
                    <button type="submit" class="btn-submit">Update Item</button>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
