<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Medical Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .form-container {
            background-color: #d3d3d3; /* Gray background as in image */
            padding: 20px;
            border-radius: 8px;
            color: #000;
        }
        .form-header {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #999;
            margin-bottom: 20px;
        }
        .tab {
            padding: 8px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background-color: #e0e0e0;
            margin-right: 2px;
            font-size: 14px;
        }
        .tab.active {
            background-color: #d3d3d3;
            border-color: #999;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            display: flex;
            margin-bottom: 10px;
            align-items: flex-start;
        }
        .form-group label {
            width: 150px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            flex: 1;
            padding: 5px;
            border: 1px solid #999;
            border-radius: 2px;
            background-color: #fff;
        }
        .form-group textarea {
            height: 60px;
            resize: vertical;
        }
        .medical-exam-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 10px;
        }
        .exam-item {
            display: flex;
            align-items: center;
        }
        .exam-item label {
            width: 120px;
            font-size: 13px;
        }
        .exam-item input {
            width: 100px;
        }
        .btn-save {
            background-color: #4361ee;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            float: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" style="display: flex; height: 100vh; overflow: hidden;">
        {% include 'sidebar.html' %}
        
        <main class="main-content" style="flex: 1; padding: 20px; overflow-y: auto;">
            <a href="{{ url_for('medical_records') }}" style="color: #4361ee; text-decoration: none; display: block; margin-bottom: 10px;"><i class="fas fa-arrow-left"></i> Back to List</a>
            
            <div class="form-container">
                <div class="form-header">Create Medical Record</div>
                
                <div class="tabs">
                    <div class="tab active" onclick="openTab(event, 'consultation')">Consultation & Exam</div>
                    <div class="tab" onclick="openTab(event, 'history')">Patient Info & History</div>
                    <div class="tab" onclick="openTab(event, 'personal')">Personal Info</div>
                    <div class="tab" onclick="openTab(event, 'emergency')">Emergency Contact</div>
                    <div class="tab" onclick="openTab(event, 'office')">Office Use</div>
                    <div class="tab" onclick="openTab(event, 'authorization')">Authorization Release</div>
                </div>
                
                <form method="POST">
                    <!-- Consultation & Exam Tab -->
                    <div id="consultation" class="tab-content active">
                        <div class="form-group">
                            <label>Patient:</label>
                            <select name="patient_id" required>
                                <option value="">Select Patient</option>
                                {% for p in patients %}
                                <option value="{{ p.patient_id }}">{{ p.first_name }} {{ p.last_name }} ({{ p.patient_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Doctor:</label>
                            <select name="doctor_id" required>
                                <option value="">Select Doctor</option>
                                {% for d in doctors %}
                                <option value="{{ d.doctor_id }}">Dr. {{ d.last_name }} ({{ d.specialty }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Date:</label>
                            <input type="date" name="date" value="{{ today }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Consult Reason:</label>
                            <textarea name="consult_reason" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Main Symptoms:</label>
                            <textarea name="main_symptoms"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Symptoms Duration:</label>
                            <input type="text" name="symptoms_duration">
                        </div>
                        
                        <div class="form-group">
                            <label>Pain Level (0-10):</label>
                            <input type="number" name="pain_level" min="0" max="10" value="0" style="width: 60px; flex: none;">
                        </div>
                        
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Medical Examination</div>
                        <div class="medical-exam-grid">
                            <div class="exam-item">
                                <label>Blood Pressure:</label>
                                <input type="text" name="blood_pressure">
                            </div>
                            <div class="exam-item">
                                <label>Temperature:</label>
                                <input type="text" name="temperature">
                            </div>
                            <div class="exam-item">
                                <label>Heart Rate:</label>
                                <input type="text" name="heart_rate">
                            </div>
                            <div class="exam-item">
                                <label>Weight:</label>
                                <input type="text" name="weight">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Preliminary Diagnosis:</label>
                            <textarea name="preliminary_diagnosis"></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Diagnosis:</label>
                            <textarea name="diagnosis" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Treatment:</label>
                            <textarea name="treatment" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Prescriptions:</label>
                            <textarea name="prescriptions"></textarea>
                        </div>
                    </div>
                    
                    <!-- Patient Info & History Tab -->
                    <div id="history" class="tab-content">
                        <div class="form-group">
                            <label>Problem Start Date:</label>
                            <input type="date" name="problem_start_date">
                        </div>
                        <div class="form-group">
                            <label>Problem Description:</label>
                            <textarea name="problem_description" style="height: 40px;"></textarea>
                        </div>
                        <div class="form-group" style="align-items: center;">
                            <label>Cause of Current Problem:</label>
                            <div style="display: flex; gap: 15px;">
                                <label style="width: auto;"><input type="checkbox" name="cause_accident"> Car Accident</label>
                                <label style="width: auto;"><input type="checkbox" name="cause_work"> Work injury</label>
                                <label style="width: auto;"><input type="checkbox" name="cause_gradual"> Gradual onset</label>
                                <label style="width: auto;"><input type="checkbox" name="cause_other"> Other</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Problem required Surgery:</label>
                            <select name="surgery_required" style="width: 100px; flex: none; margin-right: 20px;">
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                            <label style="width: auto; margin-right: 10px;">Date of Surgery:</label>
                            <input type="date" name="surgery_date" style="width: 150px; flex: none;">
                        </div>
                        <div class="form-group">
                            <label>Past Medical History:</label>
                            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; flex: 1;">
                                <label style="width: auto;"><input type="checkbox" name="hist_breathing"> Breathing Problems</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_pregnant"> Pregnant</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_heart"> Heart Problems</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_skin"> Current Wound/Skin Problems</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_pacemaker"> Pacemaker</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_cancer"> Tumor/Cancer</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_diabetes"> Diabetes</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_stroke"> Stroke</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_bone"> Bone/joint Problems</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_kidney"> Kidney Problems</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_liver"> Gallbladder/Liver</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_implants"> Electrical implants</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_anxiety"> Anxiety attacks</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_sleep"> Sleep Apnea</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_depression"> Depression</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_bowel"> Bowel/Bladder</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_alcohol"> Heavy alcohol use</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_drug"> Drug use</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_smoking"> Smoking</label>
                                <label style="width: auto;"><input type="checkbox" name="hist_headaches"> Headaches</label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Surgeries/Hospitalizations:</label>
                            <input type="text" name="hospitalizations">
                        </div>
                        <div class="form-group">
                            <label>Medications (name|dose|reason):</label>
                            <input type="text" name="medications_history">
                        </div>
                        <div class="form-group" style="align-items: center;">
                            <label>Allergies:</label>
                            <div style="display: flex; gap: 15px; align-items: center; flex: 1;">
                                <label style="width: auto;"><input type="checkbox" name="allergy_latex"> Latex</label>
                                <label style="width: auto;"><input type="checkbox" name="allergy_iodine"> Iodine</label>
                                <label style="width: auto;"><input type="checkbox" name="allergy_bromine"> Bromine</label>
                                <label style="width: auto;">Other:</label>
                                <input type="text" name="allergy_other" style="width: 200px;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Religious/Cultural views impact treatment:</label>
                            <select name="cultural_impact" style="width: 100px; flex: none;">
                                <option>No</option>
                                <option>Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Additional Comments:</label>
                            <input type="text" name="additional_comments">
                        </div>
                        <div class="form-group">
                            <label>SOAP - Subjective:</label>
                            <input type="text" name="soap_subjective">
                        </div>
                    </div>
                    
                    <!-- Personal Info Tab -->
                    <div id="personal" class="tab-content">
                        <div class="form-group">
                            <label>Full Name:</label>
                            <input type="text" name="personal_full_name">
                        </div>
                        <div class="form-group">
                            <label>Place of Birth:</label>
                            <input type="text" name="place_of_birth">
                        </div>
                        <div class="form-group">
                            <label>Address:</label>
                            <input type="text" name="personal_address">
                        </div>
                        <div class="form-group">
                            <label>Phone Number:</label>
                            <input type="text" name="personal_phone">
                        </div>
                        <div class="form-group">
                            <label>E-Mail:</label>
                            <input type="text" name="personal_email">
                        </div>
                        <div class="form-group">
                            <label>ID Number:</label>
                            <input type="text" name="id_number">
                        </div>
                        <div class="form-group">
                            <label>Social Security Number:</label>
                            <input type="text" name="ssn">
                        </div>
                        <div class="form-group">
                            <label>Status:</label>
                            <select name="personal_status" style="width: 100px; flex: none;">
                                <option value="Single">Single</option>
                                <option value="Married">Married</option>
                                <option value="Divorced">Divorced</option>
                                <option value="Widowed">Widowed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Occupation:</label>
                            <input type="text" name="occupation">
                        </div>
                        <div class="form-group">
                            <label></label>
                            <label style="width: auto;"><input type="checkbox" name="retiree"> Retiree</label>
                        </div>
                        <div class="form-group">
                            <label>Note:</label>
                            <textarea name="personal_note"></textarea>
                        </div>
                    </div>
                    
                    <!-- Emergency Contact Tab -->
                    <div id="emergency" class="tab-content">
                        <div class="form-group">
                            <label>Contact Name:</label>
                            <input type="text" name="emergency_contact_name">
                        </div>
                        <div class="form-group">
                            <label>Relationship:</label>
                            <input type="text" name="emergency_relationship">
                        </div>
                        <div class="form-group">
                            <label>Home Number:</label>
                            <input type="text" name="emergency_home_phone">
                        </div>
                        <div class="form-group">
                            <label>Mobile Number:</label>
                            <input type="text" name="emergency_mobile_phone">
                        </div>
                    </div>
                    
                    <!-- Office Use Tab -->
                    <div id="office" class="tab-content">
                        <div class="form-group">
                            <label>Membership Type:</label>
                            <input type="text" name="membership_type">
                        </div>
                        <div class="form-group">
                            <label>Membership Number:</label>
                            <input type="text" name="membership_number">
                        </div>
                        <div class="form-group">
                            <label>Payment Type:</label>
                            <input type="text" name="payment_type">
                        </div>
                        <div class="form-group">
                            <label>Staff Name:</label>
                            <input type="text" name="staff_name">
                        </div>
                        <div class="form-group">
                            <label>Staff Signature:</label>
                            <input type="text" name="staff_signature">
                        </div>
                        <div class="form-group">
                            <label>Office Notes:</label>
                            <textarea name="notes"></textarea>
                        </div>
                    </div>
                    
                    <!-- Authorization Release Tab -->
                    <div id="authorization" class="tab-content">
                        <div class="form-group">
                            <label>Requestor Name:</label>
                            <input type="text" name="requestor_name">
                        </div>
                        <div class="form-group">
                            <label>Requestor Address:</label>
                            <input type="text" name="requestor_address">
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <div class="form-group" style="flex: 1;">
                                <label style="width: 80px;">City:</label>
                                <input type="text" name="requestor_city">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="width: 80px;">State:</label>
                                <input type="text" name="requestor_state">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="width: 80px;">Zip Code:</label>
                                <input type="text" name="requestor_zip">
                            </div>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <div class="form-group" style="flex: 1;">
                                <label style="width: 80px;">Country:</label>
                                <input type="text" name="requestor_country">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="width: 80px;">Telephone:</label>
                                <input type="text" name="requestor_phone">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Fax Number:</label>
                            <input type="text" name="requestor_fax">
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <label style="width: auto; margin-right: 15px;"><input type="checkbox" name="auth_access_records"> Authorize provider to access records</label>
                        </div>
                        <div class="form-group">
                            <label style="width: auto; margin-right: 15px;"><input type="checkbox" name="auth_replace_existing"> Replace existing authorization</label>
                        </div>
                        <div class="form-group">
                            <label style="width: auto; margin-right: 15px;"><input type="checkbox" name="auth_remove_provider"> Remove provider authorization</label>
                        </div>
                        <div class="form-group">
                            <label>Purpose for disclosure:</label>
                            <input type="text" name="disclosure_purpose">
                        </div>
                        <div class="form-group">
                            <label>Date Range From:</label>
                            <input type="date" name="date_range_from" style="width: 150px; flex: none; margin-right: 20px;">
                            <label style="width: auto; margin-right: 10px;">To:</label>
                            <input type="date" name="date_range_to" style="width: 150px; flex: none;">
                        </div>
                        <div style="font-weight: bold; margin: 15px 0 5px;">Specific information to be released:</div>
                        <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;">
                            <label style="width: auto;"><input type="checkbox" name="release_discharge"> Discharge Summary</label>
                            <label style="width: auto;"><input type="checkbox" name="release_operative"> Operative Reports</label>
                            <label style="width: auto;"><input type="checkbox" name="release_consultation"> Consultation Reports</label>
                            <label style="width: auto;"><input type="checkbox" name="release_tissue"> Tissue Exam Reports</label>
                            <label style="width: auto;"><input type="checkbox" name="release_nuclear"> Nuclear Medicine CD Images</label>
                            <label style="width: auto;"><input type="checkbox" name="release_radiology"> Radiology Reports</label>
                            <label style="width: auto;"><input type="checkbox" name="release_lab"> Lab Results</label>
                            <label style="width: auto;"><input type="checkbox" name="release_history"> History & Physical</label>
                            <label style="width: auto;"><input type="checkbox" name="release_outpatient"> Outpatient Progress</label>
                            <label style="width: auto;"><input type="checkbox" name="release_pulmonary"> Pulmonary Function</label>
                            <label style="width: auto;"><input type="checkbox" name="release_nuclear_reports"> Nuclear Medicine Reports</label>
                            <label style="width: auto;"><input type="checkbox" name="release_heart"> Heart Diagnostics</label>
                            <label style="width: auto;"><input type="checkbox" name="release_radiology_cd"> Radiology CD Image</label>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn-save">Save Record</button>
                    <div style="clear: both;"></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
</body>
</html>
