<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Patient</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <style>
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 600px;
            margin: 20px auto;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn-submit {
            background-color: #4361ee;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .btn-submit:hover {
            background-color: #3f37c9;
        }
        .back-link {
            display: block;
            margin-bottom: 20px;
            color: #4361ee;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container" style="display: flex; height: 100vh; overflow: hidden;">
        <!-- Sidebar -->
        {% include 'sidebar.html' %}
        
        <main class="main-content" style="flex: 1; padding: 20px; overflow-y: auto;">
            <a href="{{ url_for('patients') }}" class="back-link"><i class="fas fa-arrow-left"></i> Back to Patients</a>
            
            <div class="form-container">
                <h2>Add New Patient</h2>
                <br>
                <form method="POST">
                    <div class="form-group">
                        <label for="patient_id">Patient ID (Optional)</label>
                        <input type="text" id="patient_id" name="patient_id" placeholder="Leave blank to auto-generate">
                    </div>
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                    <div class="form-group">
                        <label for="dob">Date of Birth</label>
                        <input type="date" id="dob" name="dob">
                    </div>
                    <div class="form-group">
                        <label for="gender">Gender</label>
                        <select id="gender" name="gender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="form-group">
                        <label for="address">Address</label>
                        <textarea id="address" name="address" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="emergency_contact">Emergency Contact</label>
                        <input type="text" id="emergency_contact" name="emergency_contact">
                    </div>
                    <div class="form-group">
                        <label for="scheme_provider">Scheme Provider</label>
                        <select id="scheme_provider" name="scheme_provider">
                            <option value="">Select Provider (Optional)</option>
                 <option value="Medical Aid Society of Malawi (MASM)">Medical Aid Society of Malawi (MASM)</option>
<option value="Central Health Medical Aid">Central Health Medical Aid</option>
<option value="Umoyo Health Care Insurance Company">Umoyo Health Care Insurance Company</option>
<option value="Wella Medical Aid Society Limited">Wella Medical Aid Society Limited</option>
<option value="Precious Medical International">Precious Medical International</option>
<option value="NABMAS (National Bank Medical Aid Scheme)">NABMAS (National Bank Medical Aid Scheme)</option>
<option value="MedPlus Medical Solutions">MedPlus Medical Solutions</option>
<option value="Bakresa Medical Centre">Bakresa Medical Centre</option>
<option value="MedHealth Malawi">MedHealth Malawi</option>
<option value="Cura Health Management">Cura Health Management</option>
<option value="Medlife Services Limited">Medlife Services Limited</option>
<option value="Lifeline Malawi">Lifeline Malawi</option>
<option value="Malmed Healthcare Services">Malmed Healthcare Services</option>
<option value="Adventist Health Services Malawi">Adventist Health Services Malawi</option>
<option value="Partners In Health Malawi">Partners In Health Malawi</option>
<option value="Liberty Life Malawi">Liberty Life Malawi</option>
<option value="Old Mutual Malawi">Old Mutual Malawi</option>
<option value="NICO Life Insurance Company">NICO Life Insurance Company</option>
<option value="NICO General Insurance">NICO General Insurance</option>
<option value="Alliance Insurance Company Malawi">Alliance Insurance Company Malawi</option>
<option value="General Alliance Insurance Malawi">General Alliance Insurance Malawi</option>
<option value="Reunion Insurance Company Malawi">Reunion Insurance Company Malawi</option>
<option value="Hollard Insurance Malawi">Hollard Insurance Malawi</option>
<option value="Sanlam Malawi">Sanlam Malawi</option>
<option value="Britam Insurance Malawi">Britam Insurance Malawi</option>
<option value="Madison Life Insurance Malawi">Madison Life Insurance Malawi</option>
<option value="Bupa Global">Bupa Global</option>
<option value="Cigna Global">Cigna Global</option>
<option value="Allianz Care">Allianz Care</option>
<option value="AXA Global Healthcare">AXA Global Healthcare</option>
<option value="Aetna International">Aetna International</option>
<option value="William Russell International">William Russell International</option>
<option value="Airtel Money Thanzi Medical Aid">Airtel Money Thanzi Medical Aid</option>
<option value="Inclusivity Health Platform">Inclusivity Health Platform</option>
<option value="Airtel Insurance Health Cover">Airtel Insurance Health Cover</option>
<option value="Mwaiwathu Private Hospital">Mwaiwathu Private Hospital</option>
<option value="Blantyre Adventist Hospital">Blantyre Adventist Hospital</option>
<option value="Beit CURE International Hospital Malawi">Beit CURE International Hospital Malawi</option>
<option value="MedPlus Clinics">MedPlus Clinics</option>
<option value="Bakresa Health Services">Bakresa Health Services</option>
<option value="Libertas General Insurance Company Limited">Libertas General Insurance Company Limited</option> 
 <option value="First Capital Bank Medical Scheme">First Capital Bank Medical Scheme</option> 
 <option value="Standard Bank Medical Scheme">Standard Bank Medical Scheme</option> 
 <option value="Press Corporation Medical Scheme">Press Corporation Medical Scheme</option> 
 <option value="Illovo Sugar Medical Scheme">Illovo Sugar Medical Scheme</option> 
 <option value="AHL Commodities Exchange">AHL Commodities Exchange</option> 
 
 <option value="Tea Brokers Central Africa Limited">Tea Brokers Central Africa Limited</option> 
 <option value="Eastern Produce Malawi Limited">Eastern Produce Malawi Limited</option> 
 <option value="Satemwa Tea and Coffee Estates">Satemwa Tea and Coffee Estates</option> 
 <option value="Lujeri Tea Estates Limited">Lujeri Tea Estates Limited</option> 
 <option value="Thyolo Tea Estates Limited">Thyolo Tea Estates Limited</option> 
 <option value="Conforzi Tea Estates Limited">Conforzi Tea Estates Limited</option> 
 <option value="Makandi Tea and Coffee Estates">Makandi Tea and Coffee Estates</option> 
 <option value="Malawi Tea 2020 Trust">Malawi Tea 2020 Trust</option> 
 <option value="Smallholder Tea Authority">Smallholder Tea Authority</option> 
 <option value="Malawi Tea Association">Malawi Tea Association</option> 
 <option value="Auction Holdings Limited">Auction Holdings Limited</option> 
 <option value="Malawi Agricultural and Industrial Investment Corporation">Malawi Agricultural and Industrial Investment Corporation</option> 
 <option value="Export Development Fund Limited">Export Development Fund Limited</option> 
 <option value="National Bank of Malawi Medical Scheme">National Bank of Malawi Medical Scheme</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="scheme_type">Scheme Type</label>
                        <input type="text" id="scheme_type" name="scheme_type" placeholder="e.g. Executive, VIP, Standard">
                    </div>
                    <button type="submit" class="btn-submit">Add Patient</button>
                </form>
            </div>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                new Choices(select, {
                    searchEnabled: true,
                    itemSelectText: '',
                    placeholder: true,
                });
            });
        });
    </script>
</body>
</html>
