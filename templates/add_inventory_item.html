<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Inventory Item</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .form-container {
            background-color: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            max-width: 800px;
            margin: 20px auto;
        }
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
        }
        input, select, textarea {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            width: 100%;
        }
        .btn-submit {
            background-color: #4361ee;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            margin-top: 20px;
        }
        .billing-codes-container .billing-code-pair {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container" >
        {% include 'sidebar.html' %}
        <main class="main-content" >
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}" style="padding: 15px; margin-bottom: 20px; border: 1px solid transparent; border-radius: 4px; {% if category == 'success' %}color: #3c763d; background-color: #dff0d8; border-color: #d6e9c6;{% else %}color: #a94442; background-color: #f2dede; border-color: #ebccd1;{% endif %}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <div class="form-container">
                <h2>Add Inventory Item</h2>
                <form action="{{ url_for('add_inventory_item') }}" method="post">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="name">Item Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Category</label>
                            <input type="text" id="category" name="category">
                        </div>
                        <div class="form-group">
                            <label for="quantity">Quantity</label>
                            <input type="number" id="quantity" name="quantity" required>
                        </div>
                        <div class="form-group">
                            <label for="unit_price">Unit Price</label>
                            <input type="number" step="0.01" id="unit_price" name="unit_price" required>
                        </div>
                        <div class="form-group">
                            <label for="supplier">Supplier</label>
                            <input type="text" id="supplier" name="supplier">
                        </div>
                        <div class="form-group">
                            <label for="expiry_date">Expiry Date</label>
                            <input type="date" id="expiry_date" name="expiry_date">
                        </div>
                        <div class="form-group">
                            <label for="min_quantity">Minimum Quantity</label>
                            <input type="number" id="min_quantity" name="min_quantity">
                        </div>
                        <div class="form-group">
                            <label for="is_medicine">Is Medicine or Service?</label>
                            <input type="checkbox" id="is_medicine" name="is_medicine" value="true">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Billing Codes</label>
                        <div class="billing-codes-container" id="billing-codes-container">
                            <!-- JS will add fields here -->
                        </div>
                        <button type="button" onclick="addBillingCode()">Add Billing Code</button>
                    </div>
                    <button type="submit" class="btn-submit">Add Item</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const providers = {{ providers | tojson }};

        function addBillingCode() {
            const container = document.getElementById('billing-codes-container');
            const div = document.createElement('div');
            div.className = 'billing-code-pair';
            
            let options = '<option value="">Select Provider</option>';
            providers.forEach(p => {
                options += `<option value="${p}">${p}</option>`;
            });

            div.innerHTML = `
                <select name="provider[]" style="flex: 1;">
                    ${options}
                </select>
                <input type="text" name="code[]" placeholder="Code" style="flex: 1;">
                <button type="button" onclick="this.parentElement.remove()" style="background: #f72585; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer;">Remove</button>
            `;
            container.appendChild(div);
        }
    </script>
</body>
</html>
