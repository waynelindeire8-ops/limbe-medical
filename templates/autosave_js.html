<script>
(function() {
    const FORM_KEY = 'autosave_{{ form_type }}';

    function serializeForm() {
        const form = document.querySelector('form');
        const data = {};
        // Grab ALL fields, including those in hidden tabs
        form.querySelectorAll('input, select, textarea').forEach(el => {
            if (!el.name) return;
            if (el.type === 'checkbox') {
                data[el.name] = el.checked;
            } else if (el.type === 'radio') {
                if (el.checked) data[el.name] = el.value;
            } else {
                data[el.name] = el.value;
            }
        });
        return data;
    }

    function restoreForm(data) {
        const form = document.querySelector('form');
        form.querySelectorAll('input, select, textarea').forEach(el => {
            if (!el.name || !(el.name in data)) return;
            if (el.type === 'checkbox') {
                el.checked = data[el.name];
            } else if (el.type === 'radio') {
                el.checked = (el.value === data[el.name]);
            } else {
                el.value = data[el.name];
            }
        });
    }

    // Restore on page load
    const saved = localStorage.getItem(FORM_KEY);
    if (saved) {
        try { restoreForm(JSON.parse(saved)); } catch(e) {}
    }

    // Save on any change (debounced)
    let timer;
    document.querySelector('form').addEventListener('input', function() {
        clearTimeout(timer);
        timer = setTimeout(() => {
            localStorage.setItem(FORM_KEY, JSON.stringify(serializeForm()));
        }, 500);
    });

    // Clear autosave on successful submit
    document.querySelector('form').addEventListener('submit', function() {
        localStorage.removeItem(FORM_KEY);
    });
})();
</script>
