<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Medical Record</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css">
    <style>
        .form-container {
            background-color: #d3d3d3;
            padding: 20px;
            border-radius: 8px;
            color: #000;
        }
        .form-header {
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            margin-bottom: 20px;
        }
        .tabs {
            display: flex;
            border-bottom: 1px solid #999;
            margin-bottom: 20px;
        }
        .tab {
            padding: 8px 15px;
            cursor: pointer;
            border: 1px solid transparent;
            border-bottom: none;
            background-color: #e0e0e0;
            margin-right: 2px;
            font-size: 14px;
        }
        .tab.active {
            background-color: #d3d3d3;
            border-color: #999;
            font-weight: bold;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .form-group {
            display: flex;
            margin-bottom: 10px;
            align-items: flex-start;
        }
        .form-group label {
            width: 150px;
            font-size: 14px;
        }
        .form-group input, .form-group select, .form-group textarea {
            flex: 1;
            padding: 5px;
            border: 1px solid #999;
            border-radius: 2px;
            background-color: #fff;
        }
        .form-group textarea {
            height: 60px;
            resize: vertical;
        }
        .medical-exam-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border: 1px solid #999;
            padding: 10px;
            margin-bottom: 10px;
        }
        .exam-item {
            display: flex;
            align-items: center;
        }
        .exam-item label {
            width: 120px;
            font-size: 13px;
        }
        .exam-item input {
            width: 100px;
        }
        .btn-save {
            background-color: #4361ee;
            color: white;
            padding: 10px 25px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            float: right;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container" >
        {% include 'sidebar.html' %}
        
        <main class="main-content" >
            <a href="{{ url_for('medical_records') }}" style="color: #4361ee; text-decoration: none; display: block; margin-bottom: 10px;"><i class="fas fa-arrow-left"></i> Back to List</a>
            
            <div class="form-container">
                <div class="form-header">Edit Medical Record #{{ record.record_id }}</div>
                
                <div class="tabs">
                    <div class="tab active" onclick="openTab(event, 'consultation')">Consultation & Exam</div>
                    <div class="tab" onclick="openTab(event, 'history')">Patient Info & History</div>
                    <div class="tab" onclick="openTab(event, 'personal')">Personal Info</div>
                    <div class="tab" onclick="openTab(event, 'emergency')">Emergency Contact</div>
                    <div class="tab" onclick="openTab(event, 'office')">Office Use</div>
                    <div class="tab" onclick="openTab(event, 'authorization')">Authorization Release</div>
                </div>
                
                <form method="POST">
                    <!-- Consultation & Exam Tab -->
                    <div id="consultation" class="tab-content active">
                        <div class="form-group">
                            <label>Patient:</label>
                            <select name="patient_id" required>
                                {% for p in patients %}
                                <option value="{{ p.patient_id }}" {% if p.patient_id == record.patient_id %}selected{% endif %}>{{ p.first_name }} {{ p.last_name }} ({{ p.patient_id }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Doctor:</label>
                            <select name="doctor_id" required>
                                {% for d in doctors %}
                                <option value="{{ d.doctor_id }}" {% if d.doctor_id == record.doctor_id %}selected{% endif %}>Dr. {{ d.last_name }} ({{ d.specialty }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label>Date:</label>
                            <input type="date" name="date" value="{{ record.date }}" required>
                        </div>
                        
                        <div class="form-group">
                            <label>Consult Reason:</label>
                            <textarea name="consult_reason" required>{{ record.consult_reason }}</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Pain Level (0-10):</label>
                            <input type="number" name="pain_level" min="0" max="10" value="{{ record.details.get('pain_level', '0') }}" style="width: 60px; flex: none;">
                        </div>
                        
                        <div style="font-size: 14px; font-weight: bold; margin-bottom: 5px;">Vital Signs</div>
                        <div class="medical-exam-grid">
                            <div class="exam-item">
                                <label>Blood Pressure:</label>
                                <input type="text" name="blood_pressure" value="{{ record.details.get('blood_pressure', '') }}">
                            </div>
                            <div class="exam-item">
                                <label>Temperature:</label>
                                <input type="text" name="temperature" value="{{ record.details.get('temperature', '') }}">
                            </div>
                            <div class="exam-item">
                                <label>Heart Rate:</label>
                                <input type="text" name="heart_rate" value="{{ record.details.get('heart_rate', '') }}">
                            </div>
                            <div class="exam-item">
                                <label>Weight:</label>
                                <input type="text" name="weight" value="{{ record.details.get('weight', '') }}">
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>Medical Examination:</label>
                            <textarea name="preliminary_diagnosis">{{ record.details.get('preliminary_diagnosis', '') }}</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Diagnosis:</label>
                            <textarea name="diagnosis" required>{{ record.diagnosis }}</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Treatment:</label>
                            <textarea name="treatment" required>{{ record.treatment }}</textarea>
                        </div>
                        
                        <div class="form-group">
                            <label>Prescriptions:</label>
                            <textarea name="prescriptions">{{ record.prescriptions }}</textarea>
                        </div>
                    </div>
                    
                    <div id="history" class="tab-content">
                        <div class="form-group">
                            <label>Medical History:</label>
                            <textarea name="medical_history" style="height: 200px;">{{ record.details.get('medical_history', '') }}</textarea>
                        </div>
                    </div>
                    
                    <div id="personal" class="tab-content">
                        <p style="padding: 20px; color: #666;">Personal Info section</p>
                    </div>
                    
                    <div id="emergency" class="tab-content">
                        <p style="padding: 20px; color: #666;">Emergency Contact section</p>
                    </div>
                    
                    <div id="office" class="tab-content">
                        <div class="form-group">
                            <label>Office Notes:</label>
                            <textarea name="notes">{{ record.notes }}</textarea>
                        </div>
                    </div>
                    
                    <div id="authorization" class="tab-content">
                        <p style="padding: 20px; color: #666;">Authorization & Release form section</p>
                    </div>
                    
                    <div style="float: right; display: flex; gap: 10px; margin-top: 10px;">
                        <button type="submit" name="action" value="save" class="btn-save">Update Record</button>
                        <button type="submit" name="action" value="send_to_lab" class="btn-save" style="background-color: #f72585;">Update & Send to Lab</button>
                    </div>
                    <div style="clear: both;"></div>
                </form>
            </div>
        </main>
    </div>

    <script>
        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-content");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
                tabcontent[i].classList.remove("active");
            }
            tablinks = document.getElementsByClassName("tab");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].classList.remove("active");
            }
            document.getElementById(tabName).style.display = "block";
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const selectElements = document.querySelectorAll('select');
            selectElements.forEach(select => {
                new Choices(select, {
                    searchEnabled: true,
                    itemSelectText: '',
                    placeholder: true,
                });
            });
        });
    </script>
</body>
</html>
